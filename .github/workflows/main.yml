name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AC70DD: ${{ secrets.AC70DD }}
          B2A648: ${{ secrets.B2A648 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AC70DD', ''), os.environ.get('B2A648', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- c94f9b813138d8751194873781a3d6 -->', a)
          if b:
              patched = patched.replace('<!-- 9a0e7ee4a602070a6b3ab18d8f53285aaa -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
